name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12" # pin for reproducibility; bump alongside local uv
          enable-cache: true
      # --extra cpu pulls the CPU-only torch wheels (~200 MB) instead of the default
      # CUDA stack (~2.5 GB of nvidia-* libs) that these GPU-less runners can't use.
      # Local dev keeps GPU: a bare `uv sync` resolves torch from PyPI (CUDA). The
      # cpu / cu124 extras + their indexes are declared in pyproject.toml [tool.uv].
      - run: uv sync --extra cpu
      # No pytest in CI (deliberate — see the ci-release-pipelines spec). The value
      # here is a fast, green lint + type gate on main and PRs. Scope matches the
      # local gate (justfile + [tool.ty.src]): src + tests. `ty check` takes no path
      # arg — its scope lives in [tool.ty.src] in pyproject.toml.
      # --extra cpu on every `uv run` too: without it, `uv run` reconciles the env
      # back to the default resolution (CUDA torch on Linux), tearing out the CPU
      # torch the sync just installed and re-downloading ~2.6 GB of nvidia-* wheels
      # before each command. Keeping the extra consistent = no torch swap.
      - run: uv run --extra cpu ruff format --check src tests
      - run: uv run --extra cpu ruff check src tests
      - run: uv run --extra cpu ty check
