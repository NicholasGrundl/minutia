[project]
name = "minutia"
version = "0.1.0"
description = "Meeting recording, transcription, and summarization tool"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nicholas Grundl", email = "nicholasgrundl@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["meeting", "transcription", "audio", "summarization", "whisper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]
dependencies = [
    "isodate",
    "loguru>=0.7.3",
    "nanoid",
    "python-dotenv",
    # Data / validation
    "numpy",
    "pydantic",
    "scipy",
    # Audio IO
    "ffmpeg-python",
    "sounddevice",
    # Models / inference
    "openai-whisper",
    "tiktoken",
    "torch>=2.4,<2.6",
    "transformers",
    # LLM clients
    "anthropic",
    "instructor",
    "openai",
    "typer>=0.25.1",
    "platformdirs>=4.9.6",
]

[dependency-groups]
# Installed by default on `uv sync`
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock>=3.15.1",
    "ruff",
]
# Notebook environment + plotting (`uv sync --group jupyter`)
jupyter = [
    "ipywidgets",
    "jupyterlab",
    "matplotlib",
    "pandas",
    "panel",
]
# System probing for notebooks (`uv sync --group diagnostics`)
diagnostics = [
    "gputil>=1.4.0",
    "psutil>=7.1.0",
    "pyaudio",
]
# Heavy ASR experiments — opt-in only (`uv sync --group experiments`)
experiments = [
    "faster-whisper",
    "nemo_toolkit[asr]",
    "pyannote.audio",
    "whisperx",
]
# Alternative audio backends (`uv sync --group media`)
media = [
    "librosa",
    "moviepy",
    "pydub",
]

[project.scripts]
minutia = "minutia.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv", 
    "build",
    "dist",
    ".mypy_cache",
    ".pytest_cache", 
    ".ruff_cache",
    "*.ipynb",  # Exclude Jupyter notebooks
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "W293", # blank line contains whitespace
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "--cov=src/minutia",
    "--cov-report=term-missing",
    "--cov-report=html",
]
xfail_strict = true
markers = [
    "unit: Unit tests (fast, < 1s each)",
    "integration: Integration tests (medium, < 30s)",
    "slow: Slow tests (full pipeline, manual runs)",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s | %(levelname)s | %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
