[project]
name = "minutia"
version = "0.1.0"
description = "Meeting recording, transcription, and summarization tool"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nicholas Grundl", email = "nicholasgrundl@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["meeting", "transcription", "audio", "summarization", "whisper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]
dependencies = [
    "loguru",
    "tiktoken",
    "ffmpeg-python",
    "openai-whisper",
    "pandas",
    "numpy<2",
    "transformers",
    "torch<2.3.0",
    "openai",
    "anthropic",
    "pydantic",
    "instructor",
    "python-dotenv",
    "click",
    "sounddevice",
    "scipy",
    "pyaudio",
    "matplotlib",
    "isodate",
    "nanoid",
    "loguru>=0.7.3",
    "gputil>=1.4.0",
    "psutil>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]
jupyter = [
    "jupyterlab",
    "ipywidgets",
    "panel",
]
media = [
    "pydub",
    "moviepy",
    "librosa",
]

[project.scripts]
minutia = "minutia:main"

# Note: UV does not support tool.uv.scripts for task running.
# Use the Makefile for development tasks (make lint, make test, etc.)
# or run commands directly with: uv run <command>

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".git",
    ".venv", 
    "build",
    "dist",
    ".mypy_cache",
    ".pytest_cache", 
    ".ruff_cache",
    "*.ipynb",  # Exclude Jupyter notebooks
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "W293", # blank line contains whitespace
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/minutia",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests (fast, < 1s each)",
    "integration: Integration tests (medium, < 30s)",
    "slow: Slow tests (full pipeline, manual runs)",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s | %(levelname)s | %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
