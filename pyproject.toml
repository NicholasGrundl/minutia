[project]
name = "minutia"
version = "0.1.0"
description = "Meeting recording, transcription, and summarization tool"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nicholas Grundl", email = "nicholasgrundl@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["meeting", "transcription", "audio", "summarization", "whisper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]
dependencies = [
    "tiktoken",
    "ffmpeg-python",
    "openai-whisper",
    "pandas",
    "numpy",
    "transformers",
    "torch",
    "openai",
    "anthropic",
    "pydantic",
    "instructor",
    "python-dotenv",
    "click",
    "sounddevice",
    "scipy",
    "pyaudio",
    "matplotlib",
    "isodate",
    "nanoid",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]
jupyter = [
    "jupyterlab",
    "ipywidgets",
    "panel",
]
media = [
    "pydub",
    "moviepy",
    "librosa",
]

[project.scripts]
minutia = "minutia:main"

# Note: UV does not support tool.uv.scripts for task running.
# Use the Makefile for development tasks (make lint, make test, etc.)
# or run commands directly with: uv run <command>

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
